name: Daily Financial Video Automation

on:
  schedule:
    - cron: '0 18 * * *' # التشغيل يومياً الساعة 6 مساءً
  workflow_dispatch: # يتيح لك التشغيل اليدوي بضغطة زر للتجربة

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg & ImageMagick)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick

    - name: Modify ImageMagick Policy for MoviePy
      run: |
        sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Cloud Pipeline Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        DID_API_KEY: ${{ secrets.DID_API_KEY }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        AVATAR_IMAGE_URL: ${{ secrets.AVATAR_IMAGE_URL }}
      run: |
        python cloud_pipeline.py
